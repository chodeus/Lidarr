name: audit

on:
  schedule:
    - cron: '41 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Merge Sources
        run: ./build.sh source

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: _src/global.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x

      - name: Audit
        run: ./build.sh audit

  notify:
    needs: audit
    if: failure()
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@cbd544d21103cfe854c8e0ec717ee2be4f097ad7 # main
    with:
      event_type: workflow
      status: failure
      title: "⚠️ Lidarr image package advisory: ${{ github.ref_name }}"
      description: "The daily audit found an advisory in a package the image ships, or could not run; the Audit step lists it. Patch it in a branch, as `chore/backend-dependency-advisories` does, or add it to `audit-ignore.txt` with the reason. If Merge Sources failed, the update workflow has reported it too."
      commit_sha: ${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
